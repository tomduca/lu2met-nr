name: Build apps

# - Pull requests to main: build and test on every platform (catches breakage).
# - Push to main (merge): same, and keep the zips as workflow artifacts.
# - Tag v*: same, and publish a GitHub Release with the zips.
# - Manual run from the Actions tab on any branch. The optional version input
#   builds zips for an existing release (e.g. a platform added later).
# - Changes that only touch Markdown or docs/ skip the build (tags always build).
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed (e.g. 1.3.0); empty for a dev build'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x64
            os: windows-latest
          # The oldest supported Ubuntu, so the app runs on distributions
          # with glibc 2.35 or newer.
          - name: linux-x86_64
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            echo "APP_VERSION=${INPUT_VERSION#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: audio_processor/requirements-build.txt

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # The default adds -D warnings; compiler warnings must not fail release builds.
          rustflags: ''
          cache-workspaces: spectral_nr

      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          PYTHON: python
        run: ./audio_processor/build_macos.sh

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libgl1 libegl1 libfontconfig1 libxkbcommon0 libdbus-1-3 zip

      - name: Build Linux app
        if: runner.os == 'Linux'
        env:
          PYTHON: python
        run: ./audio_processor/build_linux.sh

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHON: python
        run: ./audio_processor/build_windows.ps1

      # The build already produces a zip; upload it as-is so the download
      # is not a zip wrapped in another zip.
      - uses: actions/upload-artifact@v7
        with:
          path: audio_processor/dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The artifacts are the app zips themselves; without skip-decompress
      # they are extracted and no zip is left to attach to the release.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: List release files
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
